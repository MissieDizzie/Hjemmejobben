:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f3f6fa;background:#101722;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;touch-action:manipulation}button:disabled{opacity:.42;cursor:not-allowed}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #c5f17b;outline-offset:2px}main{max-width:700px;margin:auto;padding:20px 16px 115px}header,.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:15px;letter-spacing:.07em;font-weight:900}.brand span,.lime{color:#c5f17b}.logo{display:inline-grid;place-items:center;background:#c5f17b;color:#111c13;width:32px;height:32px;border-radius:11px;margin-right:8px}.muted,small{color:#aebccd}small{font-size:12px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#aebccd;margin-top:24px}h1{font-size:30px;letter-spacing:-.045em;margin:5px 0 7px}h2{font-size:21px;letter-spacing:-.025em;margin:0}h3{font-size:16px;margin:0}p{line-height:1.5}.subtitle{font-size:13px;color:#aebccd;margin:0 0 18px}.rolebar{display:flex;gap:7px;overflow-x:auto;margin:18px 0;padding-bottom:3px}.rolebar button,.seg button{background:#263346;color:#e8f0f8;border:1px solid #425169;border-radius:12px;padding:10px 13px;white-space:nowrap}.rolebar .on,.seg .on{background:#c5f17b;color:#182318;border-color:#c5f17b;font-weight:800}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0 20px}.stat{background:#253246;border:1px solid #34465d;border-radius:17px;padding:16px;min-width:0}.stat strong{font-size:clamp(21px,5vw,29px);display:block;margin-top:9px;letter-spacing:-.04em}.stat small{display:block}.seg{display:flex;gap:7px;overflow:auto;padding-bottom:7px;margin-bottom:15px}.seg button{font-size:13px}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:22px 0 11px}.count{background:#2a3e32;color:#c5f17b;border-radius:30px;padding:7px 11px;font-size:12px;font-weight:750}.card{background:#253246;border:1px solid #34465d;border-radius:19px;padding:16px;margin:10px 0}.jobtop{display:flex;align-items:center;gap:12px}.jobicon{display:grid;place-items:center;background:#37465b;border-radius:13px;width:48px;height:48px;font-size:24px;flex:none}.grow{flex:1;min-width:0}.jobname{font-size:16px;font-weight:750;overflow-wrap:anywhere}.meta{color:#aebccd;font-size:12px;margin-top:4px}.price{font-weight:850;font-size:20px;color:#c5f17b;white-space:nowrap}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.actions button{flex:1;min-width:120px}.btn{background:#34465c;border:1px solid #50647c;color:#f3f6fa;padding:11px 13px;border-radius:12px;font-weight:650}.btn.primary{background:#c5f17b;border-color:#c5f17b;color:#172418;font-weight:850}.btn.danger{background:transparent;border-color:#a97d7d;color:#ffcbcb}.pill{display:inline-block;border-radius:20px;background:#36475b;color:#dce7f1;font-size:12px;padding:6px 10px}.pill.warn{color:#ffe2a0}.pill.ok{color:#c5f17b}.status{margin-top:12px}.empty{padding:27px 15px;text-align:center;border:1px dashed #43546b;border-radius:16px;color:#aebccd}.form label{display:block;color:#c8d5e2;font-size:13px;margin:14px 0 6px}.form input,.form select,.form textarea{display:block;width:100%;background:#131e2e;border:1px solid #53647a;color:white;border-radius:12px;padding:12px}.form textarea{min-height:85px}.form button[type=submit]{margin-top:15px}.detail{margin-top:15px}.detail summary{cursor:pointer;color:#c5f17b;font-size:13px}.historyrow{display:flex;justify-content:space-between;gap:8px;border-top:1px solid #425169;padding:12px 0}.notice{margin:32px 0;color:#9babbf;font-size:12px}.toast{position:fixed;bottom:82px;left:50%;transform:translateX(-50%);background:#c5f17b;color:#142017;border-radius:14px;padding:12px 17px;font-weight:750;z-index:10;max-width:90%;box-shadow:0 8px 30px #0008}.bottom{position:fixed;bottom:0;left:0;right:0;background:#131d2bf2;backdrop-filter:blur(12px);border-top:1px solid #33445a;padding:8px max(12px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:space-around;gap:4px;z-index:5}.bottom button{border:0;background:transparent;color:#b6c3d2;padding:9px 5px;font-size:11px;min-width:0;flex:1}.bottom button.on{color:#c5f17b;font-weight:800}.bottom .symbol{display:block;font-size:21px;margin-bottom:3px}.footerline{height:1px;background:#33445a;margin:18px 0}.topaction{font-size:12px}.hidden{display:none!important}@media(min-width:740px){main{padding-bottom:40px}.bottom{position:static;max-width:700px;margin:0 auto;border:1px solid #33445a;border-radius:16px}.toast{bottom:20px}}@media(max-width:350px){.brand{font-size:13px}.card{padding:12px}.price{font-size:17px}}
</style></head><body><main><header><div class="brand"><span class="logo">⚡</span>HJEMME<span>JOBBEN</span></div><span class="pill">V5 · DEMO</span></header><div class="eyebrow" id="eyebrow">DINE MULIGHETER</div><h1 id="greeting"></h1><p class="subtitle" id="subtitle"></p><div class="rolebar" id="users"></div><div class="stats" id="stats"></div><section id="content" aria-live="polite"></section><p class="notice">Dette er en demo. Data lagres kun på denne enheten, uten synkronisering eller sikker innlogging. Reservasjoner kontrolleres når appen brukes. Bruk ikke demoen som endelig lønnsregnskap.</p><nav class="bottom" id="tabs" aria-label="Hovedmeny"></nav></main><div id="toast" class="toast hidden" role="status"></div><script>
'use strict';
const KEY='hj_v5', defaults=[{id:1,name:'Tømme søppel',price:10,freq:'Daglig',icon:'🗑️',enabled:true},{id:2,name:'Tømme oppvaskmaskinen',price:15,freq:'Daglig',icon:'🍽️',enabled:true},{id:3,name:'Støvsuge stua',price:40,freq:'Ukentlig',icon:'🧹',enabled:true},{id:4,name:'Vaske badet',price:75,freq:'Ukentlig',icon:'🧽',enabled:true},{id:5,name:'Brette klær',price:30,freq:'Ved behov',icon:'👕',enabled:true}];
const $=id=>document.getElementById(id),now=()=>Date.now(),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>Number(n||0).toLocaleString('nb-NO',{maximumFractionDigits:2})+' kr',uid=()=>now()+Math.random(),day=t=>{let d=new Date(t);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')},week=t=>{let d=new Date(t);d.setHours(12,0,0,0);d.setDate(d.getDate()-(d.getDay()+6)%7);return day(d)},period=(f,t)=>f==='Daglig'?day(t):f==='Ukentlig'?week(t):'once';
let s;try{for(const key of [KEY,'hj_v4','hj_v3','hj_v2']){let x=localStorage.getItem(key);if(x){s=JSON.parse(x);break}}}catch(e){console.warn('Kunne ikke lese tidligere data',e)}s=s&&typeof s==='object'?s:{};s.names=s.names||{b1:'Barn 1',b2:'Barn 2'};s.jobs=Array.isArray(s.jobs)?s.jobs:structuredClone(defaults);s.records=Array.isArray(s.records)?s.records:[];s.payments=Array.isArray(s.payments)?s.payments:[];s.paid=s.paid||{b1:0,b2:0};s.user=['b1','b2','parent'].includes(s.user)?s.user:'b1';s.tab='board';s.jobs=s.jobs.map(j=>({...j,enabled:j.enabled!==false,icon:j.icon||'⚡'}));for(const r of s.records){if(['approved','paid'].includes(r.status)&&!r.approvedAt)r.approvedAt=r.at;if(r.status==='paid'&&!r.paidAt)r.paidAt=r.approvedAt;if(!r.period){let j=s.jobs.find(j=>j.id===r.job);r.period=period(j?.freq||'Ved behov',r.at||now())}};
function save(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){alert('Kunne ikke lagre data på denne enheten. Eksporter en sikkerhetskopi.')}}function toast(msg){let t=$('toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.add('hidden'),2800)}function sweep(){let changed=false;for(const r of s.records)if(r.status==='taken'&&now()-r.at>=86400000){r.status='expired';changed=true}if(changed)save()}function active(j){let p=period(j.freq,now());return s.records.find(r=>r.job===j.id&&r.period===p&&['taken','pending','approved','paid','rejected'].includes(r.status))}function available(j){return j.enabled&&!active(j)}function earnedRecords(w){return s.records.filter(r=>r.who===w&&['approved','paid'].includes(r.status))}function due(w){return Math.max(0,Math.round(s.records.filter(r=>r.who===w&&['approved','paid'].includes(r.status)).reduce((a,r)=>a+r.pay-(r.partialPaid||0),0)*100)/100)}function earned(w){return earnedRecords(w).reduce((a,r)=>a+r.pay,0)}function weekEarned(w){return earnedRecords(w).filter(r=>week(r.approvedAt||r.at)===week(now())).reduce((a,r)=>a+r.pay,0)}function yearEarned(w){return earnedRecords(w).filter(r=>new Date(r.approvedAt||r.at).getFullYear()===new Date().getFullYear()).reduce((a,r)=>a+r.pay,0)}function btn(label,act,cls=''){if(act.startsWith('release:')){const id=act.slice(8);if(String(confirmReleaseId)===id){label='Bekreft at du gir fra deg';act='release-confirm:'+id;cls+=' danger'}}return `<button type="button" class="btn ${cls}" data-act="${esc(act)}">${label}</button>`}function nameOf(r){return esc(r.name||s.jobs.find(j=>j.id===r.job)?.name||'Oppgave')}const statuses={taken:'Reservert',pending:'Venter på godkjenning',approved:'Godkjent',paid:'Utbetalt',rejected:'Må gjøres på nytt',released:'Frigitt',expired:'Utløpt'};
let confirmReleaseId=null;function jobCard(j,manage=false){let r=active(j);let body=manage?btn('Rediger','edit:'+j.id)+btn(j.enabled?'Pause':'Aktiver','toggle:'+j.id):r?(r.who===s.user&&r.status==='taken'?btn('Marker fullført','finish:'+r.id,'primary')+btn('Gi fra meg','release:'+r.id):`<span class="pill ${r.status==='rejected'?'warn':''}">${r.status==='taken'?'Reservert av '+esc(s.names[r.who]||'barn'):r.status==='pending'?'Venter på godkjenning':r.status==='rejected'?'Til retting':'Utført i perioden'}</span>`):s.user==='parent'?'<span class="pill ok">Ledig</span>':btn('Ta oppdrag','take:'+j.id,'primary');return `<article class="card"><div class="jobtop"><div class="jobicon" aria-hidden="true">${esc(j.icon)}</div><div class="grow"><div class="jobname">${esc(j.name)}</div><div class="meta">${esc(j.freq)}${j.enabled?'':' · Pauset'}</div></div><div class="price">${money(j.price)}</div></div><div class="actions">${body}</div></article>`}
function recordCard(r,parent){let buttons=parent&&r.status==='pending'?btn('Godkjenn','approve:'+r.id,'primary')+btn('Avvis','reject:'+r.id,'danger'):!parent&&r.who===s.user&&r.status==='taken'?btn('Marker fullført','finish:'+r.id,'primary')+btn('Gi fra meg','release:'+r.id):!parent&&r.who===s.user&&r.status==='rejected'?btn('Send inn på nytt','resubmit:'+r.id,'primary')+btn('Gi fra meg','release:'+r.id):'';return `<article class="card"><div class="row"><div class="grow"><div class="jobname">${nameOf(r)}</div><div class="meta">${esc(s.names[r.who]||r.who)} · ${new Date(r.at).toLocaleDateString('nb-NO')}</div></div><span class="price">${money(r.pay)}</span></div><div class="status"><span class="pill ${r.status==='rejected'?'warn':''}">${statuses[r.status]||esc(r.status)}</span></div>${r.status==='rejected'?`<p class="muted">Begrunnelse: ${esc(r.reason||'Må gjøres bedre.')}</p>`:''}${buttons?`<div class="actions">${buttons}</div>`:''}</article>`}
function render(){sweep();let par=s.user==='parent',u=s.user;$('eyebrow').textContent=par?'FORELDREOVERSIKT':'DINE MULIGHETER';$('greeting').textContent=par?'Kontrollsenter':`Hei, ${s.names[u]} 👋`;$('subtitle').textContent=par?'Hold oversikt over oppdrag, godkjenninger og betalinger.':'Finn din neste jobb. Gjør den. Få betalt.';$('users').innerHTML=[['b1',s.names.b1],['b2',s.names.b2],['parent','Forelder']].map(([id,n])=>`<button data-act="user:${id}" class="${u===id?'on':''}" aria-pressed="${u===id}">${esc(n)}</button>`).join('');$('stats').innerHTML=par?`<div class="stat"><small>Venter på godkjenning</small><strong class="lime">${s.records.filter(r=>r.status==='pending').length}</strong></div><div class="stat"><small>Til utbetaling</small><strong>${money(due('b1')+due('b2'))}</strong></div>`:`<div class="stat"><small>Opptjent denne uka</small><strong class="lime">${money(weekEarned(u))}</strong></div><div class="stat"><small>Til utbetaling</small><strong>${money(due(u))}</strong></div>`;
let tabs=par?[['board','Oppdrag','▦'],['review','Godkjenn','✓'],['manage','Administrer','⚙'],['money','Økonomi','◉'],['history','Historikk','☷']]:[['board','Oppdrag','▦'],['review','Mine jobber','✓'],['alerts','Beskjeder','♧'],['money','Penger','◉'],['profile','Profil','♙']];$('tabs').innerHTML=tabs.map(([id,label,ico])=>`<button data-act="tab:${id}" class="${s.tab===id?'on':''}" aria-current="${s.tab===id?'page':'false'}"><span class="symbol">${ico}</span>${label}${id==='alerts'&&s.records.some(r=>r.who===u&&r.status==='rejected')?' ●':''}</button>`).join('');let h='';
if(s.tab==='board'){let jobs=s.jobs.filter(j=>j.enabled),open=jobs.filter(available);h=`<div class="sectionhead"><h2>${par?'Denne ukens oppdrag':'Ledige oppdrag'}</h2><span class="count">${open.length} ledige</span></div><p class="subtitle">${par?'Se hvem som har reservert hva, og hvilke jobber som er ledige.':'Velg et oppdrag før søskenet ditt gjør det.'}</p>`;if(par){for(const [title,items] of [['Daglige oppgaver',jobs.filter(j=>j.freq==='Daglig')],['Ukentlige oppgaver',jobs.filter(j=>j.freq==='Ukentlig')],['Ved behov',jobs.filter(j=>j.freq==='Ved behov')]]){h+=`<div class="sectionhead"><h3>${title}</h3><small>${items.length} oppgaver</small></div>`+(items.map(j=>jobCard(j)).join('')||'<div class="empty">Ingen oppgaver.</div>')}}else{h+=open.map(j=>jobCard(j)).join('')||'<div class="empty">Ingen ledige oppdrag akkurat nå.</div>';let mine=s.records.filter(r=>r.who===u&&r.status==='taken').slice().reverse();h+=`<div class="sectionhead"><h2>Mine aktive oppdrag</h2><span class="count">${mine.length}</span></div>`+(mine.map(r=>recordCard(r,false)).join('')||'<div class="empty">Du har ingen reserverte oppdrag.</div>')}}
if(s.tab==='review'){let rows=s.records.filter(r=>par?r.status==='pending':r.who===u&&['taken','pending','approved','paid','rejected'].includes(r.status)).slice().reverse();h=`<div class="sectionhead"><h2>${par?'Til godkjenning':'Mine jobber'}</h2><span class="count">${rows.length}</span></div>`+(rows.map(r=>recordCard(r,par)).join('')||'<div class="empty">Ingen oppgaver her akkurat nå.</div>')}
if(s.tab==='alerts'){let rows=s.records.filter(r=>r.who===u&&r.status==='rejected').slice().reverse();h='<div class="sectionhead"><h2>Beskjeder</h2></div>'+(rows.map(r=>`<div class="card"><span class="pill warn">Trenger oppfølging</span><h3 style="margin-top:12px">${nameOf(r)}</h3><p>${esc(r.reason||'Oppgaven må gjøres bedre.')}</p><div class="actions">${btn('Gå til mine jobber','tab:review','primary')}</div></div>`).join('')||'<div class="empty">Ingen nye beskjeder.</div>')}
if(s.tab==='manage'){h=`<div class="sectionhead"><h2>Alle oppgaver</h2>${btn('+ Ny oppgave','new','primary')}</div><p class="subtitle">Rediger pris, ikon og hyppighet. Pausede oppgaver vises ikke for barna.</p>`+s.jobs.map(j=>jobCard(j,true)).join('')}
if(s.tab==='editor'){let j=s.jobs.find(x=>x.id===s.editId);h=`<div class="sectionhead"><h2>${j?'Rediger oppgave':'Ny oppgave'}</h2></div><form id="jobform" class="card form"><label for="jn">Oppgave</label><input id="jn" required maxlength="80" value="${esc(j?.name||'')}"><label for="jp">Betaling i kr</label><input id="jp" type="number" min="1" max="10000" step="1" required value="${j?.price||25}"><label for="jf">Hyppighet</label><select id="jf">${['Daglig','Ukentlig','Ved behov'].map(f=>`<option ${j?.freq===f?'selected':''}>${f}</option>`).join('')}</select><label for="ji">Ikon</label><select id="ji">${['🗑️','🍽️','🧹','🧽','👕','🚗','🍳','🪴','🐈','🛏️','📦','⚡'].map(i=>`<option ${j?.icon===i?'selected':''}>${i}</option>`).join('')}</select><div class="actions"><button type="submit" class="btn primary">Lagre oppgave</button>${btn('Avbryt','tab:manage')}</div></form>`}
if(s.tab==='money'){h='<div class="sectionhead"><h2>Lønn og utbetaling</h2></div><p class="subtitle">Opptjening beregnes fra datoen en forelder godkjente jobben.</p>'+(par?['b1','b2']:[u]).map(w=>`<div class="card"><div class="row"><h3>${esc(s.names[w])}</h3><span class="pill ${due(w)?'warn':'ok'}">${due(w)?'Utestående':'Alt betalt'}</span></div><div class="stats"><div class="stat"><small>Denne uka</small><strong class="lime">${money(weekEarned(w))}</strong></div><div class="stat"><small>Hittil i år</small><strong>${money(yearEarned(w))}</strong></div></div><div class="footerline"></div><div class="row"><span>Til gode</span><strong class="price">${money(due(w))}</strong></div><p class="meta">Utbetalt totalt: ${money(s.paid[w]||0)}</p>${par&&due(w)?`<div class="actions">${btn('Registrer betaling','pay:'+w,'primary')}</div>`:''}<details class="detail"><summary>Betalingshistorikk (${s.payments.filter(p=>p.who===w).length})</summary>${s.payments.filter(p=>p.who===w).slice().reverse().map(p=>`<div class="historyrow"><small>${new Date(p.at).toLocaleDateString('nb-NO')}${p.reversalOf?' · Korrigering':''}</small><b>${money(p.amount)}</b></div>`).join('')||'<p class="muted">Ingen betalinger registrert.</p>'}</details></div>`).join('')+(par?`<div class="actions">${btn('Korriger siste betaling','undoPay','danger')}</div>`:'')}
if(s.tab==='history'){h=`<div class="sectionhead"><h2>Aktivitetslogg</h2></div>`+s.records.slice().reverse().map(r=>recordCard(r,true)).join('')+`<div class="actions">${btn('Eksporter sikkerhetskopi','export','primary')}</div><div class="actions">${btn('Importer sikkerhetskopi','import')}</div><input id="importfile" type="file" accept="application/json,.json" hidden>`}
if(s.tab==='profile'){h=`<div class="sectionhead"><h2>Min profil</h2></div><form id="nickform" class="card form"><label for="nick">Kallenavn</label><input id="nick" maxlength="20" required value="${esc(s.names[u])}"><button class="btn primary" type="submit">Lagre kallenavn</button></form><div class="actions">${btn('Eksporter sikkerhetskopi','export')}</div>`}
$('content').innerHTML=h;let nf=$('nickform');if(nf)nf.onsubmit=e=>{e.preventDefault();let n=$('nick').value.trim();if(n){s.names[u]=n;save();render();toast('Kallenavn lagret')}};let jf=$('jobform');if(jf)jf.onsubmit=e=>{e.preventDefault();if(s.user!=='parent')return;let name=$('jn').value.trim(),price=Number($('jp').value);if(!name||!Number.isInteger(price)||price<1||price>10000)return;let data={name,price,freq:$('jf').value,icon:$('ji').value};let j=s.jobs.find(x=>x.id===s.editId);if(j)Object.assign(j,data);else s.jobs.push({...data,id:uid(),enabled:true});s.tab='manage';save();render();toast('Oppgaven er lagret')};let imp=$('importfile');if(imp)imp.onchange=async e=>{let file=e.target.files[0];if(!file)return;try{let x=JSON.parse(await file.text());if(!x||!Array.isArray(x.jobs)||!Array.isArray(x.records)||!x.names||!Array.isArray(x.payments||[]))throw Error('Ugyldig fil');if(!confirm('Erstatte ALLE data på denne enheten med sikkerhetskopien?'))return;s=x;s.tab='board';save();render();toast('Sikkerhetskopi importert')}catch(e){alert('Kunne ikke importere: '+e.message)}}}
function exportData(){let blob=new Blob([JSON.stringify(s,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='hjemmejobben-sikkerhetskopi-'+day(now())+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function act(a){let k=a.indexOf(':'),op=k<0?a:a.slice(0,k),arg=k<0?'':a.slice(k+1);if(op==='user'){s.user=arg;s.tab='board'}else if(op==='tab')s.tab=arg;else if(op==='new'&&s.user==='parent'){s.editId=null;s.tab='editor'}else if(op==='edit'&&s.user==='parent'){s.editId=Number(arg);s.tab='editor'}else if(op==='toggle'&&s.user==='parent'){let j=s.jobs.find(j=>j.id===Number(arg));if(j)j.enabled=!j.enabled}else if(op==='take'&&s.user!=='parent'){let j=s.jobs.find(j=>j.id===Number(arg));if(j&&available(j)){s.records.push({id:uid(),job:j.id,name:j.name,who:s.user,pay:j.price,period:period(j.freq,now()),status:'taken',at:now()});toast('Oppdraget er ditt!')}}else if(['finish','release','release-confirm','approve','reject','resubmit'].includes(op)){let r=s.records.find(r=>String(r.id)===String(arg));if(r){if(op==='finish'&&r.who===s.user&&r.status==='taken'){r.status='pending';toast('Sendt til godkjenning')}if(op==='release'&&r.who===s.user&&['taken','rejected'].includes(r.status)){confirmReleaseId=r.id;toast('Trykk på bekreftelsesknappen for å gi fra deg jobben')}if(op==='release-confirm'&&r.who===s.user&&['taken','rejected'].includes(r.status)){r.status='released';confirmReleaseId=null;toast('Oppdraget er ledig igjen')}if(op==='resubmit'&&r.who===s.user&&r.status==='rejected'){r.status='pending';r.reason='';toast('Sendt inn på nytt')}if(op==='approve'&&s.user==='parent'&&r.status==='pending'){r.status='approved';r.approvedAt=now();toast('Oppdrag godkjent')}if(op==='reject'&&s.user==='parent'&&r.status==='pending'){let reason=prompt('Hvorfor avvises oppdraget? Barnet får se begrunnelsen.');if(reason===null)return;r.reason=reason.trim()||'Oppdraget må gjøres bedre.';r.status='rejected';toast('Tilbakemelding sendt')}}}else if(op==='pay'&&s.user==='parent'){let amount=due(arg);if(amount){let input=prompt(`Hvor mye er betalt til ${s.names[arg]}? (maks ${money(amount)})`,String(amount));if(input===null)return;let sum=Number(input.trim().replace(',','.'));let cents=Math.round(sum*100);if(!Number.isFinite(sum)||sum<=0||cents>Math.round(amount*100)||Math.abs(sum*100-cents)>0.001){alert('Ugyldig beløp');return}let remaining=cents,alloc=[];for(let r of s.records.filter(r=>r.who===arg&&['approved','paid'].includes(r.status)).sort((a,b)=>(a.approvedAt||a.at)-(b.approvedAt||b.at))){let outstanding=Math.round(r.pay*100)-Math.round((r.partialPaid||0)*100),part=Math.min(remaining,Math.max(0,outstanding));if(part<=0)continue;r.partialPaid=(Math.round((r.partialPaid||0)*100)+part)/100;alloc.push({id:r.id,cents:part});remaining-=part;if(Math.round(r.partialPaid*100)>=Math.round(r.pay*100)){r.status='paid';r.paidAt=now()}if(remaining<=0)break}if(remaining!==0){alert('Kunne ikke fordele betalingen.');return}s.paid[arg]=Math.round(((s.paid[arg]||0)+sum)*100)/100;s.payments.push({id:uid(),who:arg,amount:sum,at:now(),alloc});toast('Betaling registrert')}}else if(op==='undoPay'&&s.user==='parent'){let p=s.payments.slice().reverse().find(p=>p.amount>0&&!p.reversedAt);if(!p){alert('Ingen betalinger å korrigere.');return}if(!p.alloc){alert('Denne eldre betalingen mangler detaljer for trygg automatisk korrigering. Eksporter data og kontroller manuelt.');return}if(!confirm(`Korrigere siste betaling på ${money(p.amount)} til ${s.names[p.who]}?`))return;for(let a of p.alloc){let r=s.records.find(r=>r.id===a.id);if(!r)continue;r.partialPaid=Math.max(0,Math.round((r.partialPaid||0)*100-a.cents)/100);if(r.status==='paid'){r.status='approved';delete r.paidAt}}s.paid[p.who]=Math.max(0,Math.round(((s.paid[p.who]||0)-p.amount)*100)/100);p.reversedAt=now();s.payments.push({id:uid(),who:p.who,amount:-p.amount,at:now(),reversalOf:p.id});toast('Betalingen er korrigert')}else if(op==='export'){exportData();return}else if(op==='import'){let input=$('importfile');if(input)input.click();return}save();render()}
document.addEventListener('click',e=>{let b=e.target.closest('[data-act]');if(b){try{act(b.dataset.act)}catch(err){console.error(err);alert('Noe gikk galt: '+err.message)}}});save();render();
