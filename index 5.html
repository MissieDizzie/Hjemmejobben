<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0c1220"><title>Hjemmejobben 4.0</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#f1f5fa;background:#0c1220}*{box-sizing:border-box}body{margin:0}main{max-width:650px;margin:auto;padding:20px 16px 80px}header{display:flex;justify-content:space-between;align-items:center}.brand{font-size:14px;font-weight:850;letter-spacing:.1em}.brand b,.green{color:#c7f783}h1{font-size:29px;margin:18px 0 4px;letter-spacing:-.04em}h2{font-size:19px;margin:12px 0}h3{font-size:16px;margin:0 0 6px}.muted,small{color:#aab8c8}.muted{font-size:13px}.tag{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:#b3c4d6}.card{background:#192437;border:1px solid #2d3d53;border-radius:18px;padding:16px;margin:12px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.stack{display:flex;flex-direction:column;gap:5px}.tabs{display:flex;gap:7px;overflow-x:auto;padding:12px 0}.tabs button{white-space:nowrap}button,input,select,textarea{font:inherit;border-radius:11px;padding:11px 12px}button{border:1px solid #465a73;background:#25354c;color:#f3f7fa;cursor:pointer}button.primary,button.selected{background:#c7f783;border-color:#c7f783;color:#142017;font-weight:750}button:disabled{opacity:.45}input,select,textarea{background:#0f192a;border:1px solid #465a73;color:white;width:100%}label{font-size:13px;color:#b8c8d8;display:block;margin:10px 0 5px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#192437;border:1px solid #2d3d53;border-radius:16px;padding:14px}.stat strong{font-size:25px;display:block;margin-top:8px}.pill{display:inline-block;background:#2b3b50;border-radius:50px;padding:6px 9px;font-size:12px}.pill.warn{color:#ffe2a0}.pill.ok{color:#c7f783}.price{font-weight:850;font-size:21px;white-space:nowrap}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions button{flex:1}.icon{display:grid;place-items:center;background:#2d3c50;border-radius:13px;width:45px;height:45px;font-size:23px;flex:none}.job{display:flex;align-items:center;gap:12px}.job .stack{flex:1}.notice{margin-top:28px;color:#aab8c8;font-size:12px;line-height:1.5}.empty{padding:28px 10px;text-align:center;color:#aab8c8}.section{margin-top:20px}.badge{background:#c7f783;color:#142017;padding:5px 9px;border-radius:30px;font-size:11px;font-weight:800}.count{color:#c7f783;font-weight:700}.full{width:100%}details summary{cursor:pointer}hr{border:0;border-top:1px solid #34445a;margin:15px 0}textarea{min-height:65px}button:focus-visible,input:focus-visible{outline:2px solid #c7f783}
</style></head><body><main><header><span class="brand">⚡ HJEMME<b>JOBBEN</b></span><span class="badge">V4 · DEMO</span></header><h1 id="greeting"></h1><p class="muted" id="subtitle"></p><div class="tabs" id="users"></div><div class="grid" id="stats"></div><nav class="tabs" id="tabs"></nav><section id="content"></section><p class="notice">Dette er en prototype: roller kan byttes uten innlogging, og data lagres kun i denne nettleseren. Ingen synkronisering mellom telefoner eller pushvarsler. Reservasjoner utløper etter 24 timer når siden åpnes eller brukes. Ikke bruk som endelig lønnsregnskap.</p></main><script>
const defaults=[{id:1,name:'Tømme søppel',price:10,freq:'Daglig',icon:'🗑️',enabled:true},{id:2,name:'Tømme oppvaskmaskinen',price:15,freq:'Daglig',icon:'🍽️',enabled:true},{id:3,name:'Støvsuge stua',price:40,freq:'Ukentlig',icon:'🧹',enabled:true},{id:4,name:'Vaske badet',price:75,freq:'Ukentlig',icon:'🧽',enabled:true},{id:5,name:'Brette klær',price:30,freq:'Ved behov',icon:'👕',enabled:true}];
const KEY='hj_v4';let old;try{old=JSON.parse(localStorage.getItem(KEY))||JSON.parse(localStorage.getItem('hj_v3'))||JSON.parse(localStorage.getItem('hj_v2'))}catch(e){};let s=old||{names:{b1:'Barn 1',b2:'Barn 2'},jobs:defaults,records:[],paid:{b1:0,b2:0},user:'b1',tab:'board'};s.jobs=(s.jobs||defaults).map(j=>({...j,enabled:j.enabled!==false,icon:j.icon||iconFor(j.name)}));s.records=s.records||[];s.names=s.names||{b1:'Barn 1',b2:'Barn 2'};s.paid=s.paid||{b1:0,b2:0};s.user=s.user||'b1';s.tab='board';s.payments=s.payments||[];for(let r of s.records){if(['approved','paid'].includes(r.status)&&!r.approvedAt)r.approvedAt=r.at;if(r.status==='paid'&&!r.paidAt)r.paidAt=r.approvedAt;}
const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const time=()=>Date.now();const day=t=>new Date(t).toLocaleDateString('sv-SE');const week=t=>{let d=new Date(t);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return day(d)};const period=(f,t)=>f==='Daglig'?day(t):f==='Ukentlig'?week(t):'once';function iconFor(n){n=n.toLowerCase();return n.includes('søppel')?'🗑️':n.includes('oppvask')?'🍽️':n.includes('støvsug')?'🧹':n.includes('bad')?'🧽':n.includes('klær')||n.includes('vask')?'👕':n.includes('bil')?'🚗':n.includes('mat')?'🍳':'⚡'}function save(){localStorage.setItem(KEY,JSON.stringify(s))}function sweep(){let changed=false;for(let r of s.records)if(r.status==='taken'&&time()-r.at>=86400000){r.status='expired';changed=true}if(changed)save()}
function active(j){let p=period(j.freq,time());return s.records.find(r=>r.job===j.id&&r.period===p&&['taken','pending','approved','paid'].includes(r.status))}function available(j){return j.enabled&&!active(j)}function due(w){return Math.round(s.records.filter(r=>r.who===w&&r.status==='approved').reduce((a,r)=>a+r.pay-(r.partialPaid||0),0)*100)/100}function earned(w){return s.records.filter(r=>r.who===w&&['approved','paid'].includes(r.status)).reduce((a,r)=>a+r.pay,0)}function weekStart(t){let d=new Date(t);d.setHours(0,0,0,0);d.setDate(d.getDate()-(d.getDay()+6)%7);return d.getTime()}function weekEarned(w){let start=weekStart(time());return s.records.filter(r=>r.who===w&&['approved','paid'].includes(r.status)&&r.approvedAt>=start).reduce((a,r)=>a+r.pay,0)}function yearEarned(w){let d=new Date(),y=d.getFullYear();return s.records.filter(r=>r.who===w&&['approved','paid'].includes(r.status)&&new Date(r.approvedAt).getFullYear()===y).reduce((a,r)=>a+r.pay,0)}function money(n){return Number(n||0).toLocaleString('nb-NO')+' kr'}function payLog(w){return s.payments.filter(p=>p.who===w).slice().reverse()}function btn(t,a,cls=''){return `<button class="${cls}" data-act="${a}">${t}</button>`}function jobName(r){return esc(r.name||s.jobs.find(j=>j.id===r.job)?.name||'Oppgave')}function jobCard(j,mode){let r=active(j);return `<div class="card"><div class="job"><div class="icon">${esc(j.icon)}</div><div class="stack"><span class="tag">${esc(j.freq)}${!j.enabled?' · PAUSET':''}</span><b>${esc(j.name)}</b></div><span class="price">${j.price} kr</span></div><div class="actions">${mode==='manage'?btn('Rediger','edit:'+j.id)+btn(j.enabled?'Pause':'Aktiver','toggle:'+j.id):r?`<span class="pill">${r.status==='taken'?'Tatt av '+esc(s.names[r.who]):r.status==='pending'?'Venter på godkjenning':'Utført i perioden'}</span>${r.status==='taken'&&r.who===s.user?btn('Fullført','finish:'+r.id,'primary'):''}`:s.user==='parent'?'<span class="pill ok">Ledig</span>':btn('Ta oppdrag','take:'+j.id,'primary')}</div></div>`}
function render(){sweep();let u=s.user,par=u==='parent';$('greeting').textContent=par?'Kontrollsenter':`Hei, ${s.names[u]} 👋`;$('subtitle').textContent=par?'Oversikt over oppdrag, godkjenning og lønn':'Velg en jobb. Gjør den. Få betalt.';$('users').innerHTML=[['b1',s.names.b1],['b2',s.names.b2],['parent','Forelder']].map(([id,n])=>btn(esc(n),'user:'+id,u===id?'selected':'')).join('');let tabs=par?[['board','Denne uka'],['review','Godkjenn'],['manage','Alle jobber'],['money','Økonomi'],['history','Historikk']]:[['board','Ledige jobber'],['review','Mine jobber'],['alerts','Beskjeder'],['money','Penger'],['profile','Profil']];$('tabs').innerHTML=tabs.map(([id,n])=>btn(n+(id==='alerts'?' ('+s.records.filter(r=>r.who===u&&r.status==='rejected').length+')':''),'tab:'+id,s.tab===id?'selected':'')).join('');$('stats').innerHTML=par?`<div class="stat"><small>Venter på godkjenning</small><strong class="green">${s.records.filter(r=>r.status==='pending').length}</strong></div><div class="stat"><small>Til utbetaling</small><strong>${due('b1')+due('b2')} kr</strong></div>`:`<div class="stat"><small>Opptjent denne uka</small><strong class="green">${money(weekEarned(u))}</strong></div><div class="stat"><small>Til utbetaling</small><strong>${due(u)} kr</strong></div>`;
let h='';if(s.tab==='board'){let jobs=s.jobs.filter(j=>j.enabled);h=`<div class="row"><h2>${par?'Denne ukens oppdrag':'Jobbmarkedet'}</h2><span class="count">${jobs.filter(available).length} ledige</span></div>`;if(par){let daily=jobs.filter(j=>j.freq==='Daglig'),weekly=jobs.filter(j=>j.freq==='Ukentlig'),extra=jobs.filter(j=>j.freq==='Ved behov');for(let [title,items] of [['Daglige jobber',daily],['Ukentlige jobber',weekly],['Ved behov',extra]]){h+=`<div class="section"><h3>${title} · ${items.length}</h3>${items.map(j=>jobCard(j,'board')).join('')||'<p class="muted">Ingen oppgaver</p>'}</div>`}h+='<p class="muted">Daglige oppgaver vises som én forekomst per dag. Ukentlige som én per uke. Oppgaver som venter på godkjenning forblir opptatt.</p>'}else h+=jobs.map(j=>jobCard(j,'board')).join('')||'<div class="empty">Ingen aktive jobber.</div>'}
if(s.tab==='review'){let rows=s.records.filter(r=>par?r.status==='pending':r.who===u&&['taken','pending','approved','rejected'].includes(r.status)).slice().reverse();h=`<h2>${par?'Til godkjenning':'Mine jobber'}</h2>`+(rows.map(r=>`<div class="card"><div class="row"><div class="stack"><b>${jobName(r)}</b><small>${esc(s.names[r.who])} · ${r.pay} kr</small></div><span class="pill ${r.status==='rejected'?'warn':''}">${({taken:'Pågår',pending:'Til godkjenning',approved:'Godkjent',rejected:'Avvist'})[r.status]}</span></div>${r.status==='rejected'?`<p class="muted">Begrunnelse: ${esc(r.reason||'Ingen begrunnelse')}</p>`:''}<div class="actions">${par?btn('Godkjenn','approve:'+r.id,'primary')+btn('Avvis','reject:'+r.id):r.status==='taken'?btn('Marker fullført','finish:'+r.id,'primary')+btn('Gi fra meg','release:'+r.id):r.status==='rejected'?btn('Send inn på nytt','resubmit:'+r.id,'primary')+btn('Gi fra meg','release:'+r.id):''}</div></div>`).join('')||'<div class="empty">Ingen jobber her akkurat nå.</div>')}
if(s.tab==='alerts'){let rows=s.records.filter(r=>r.who===u&&r.status==='rejected').slice().reverse();h='<h2>Beskjeder</h2>'+ (rows.map(r=>`<div class="card"><span class="pill warn">⚠ Jobb avvist</span><h3 style="margin-top:12px">${jobName(r)}</h3><p>${esc(r.reason||'Forelder har bedt om en ny gjennomgang.')}</p>${btn('Gå til mine jobber','tab:review','primary')}</div>`).join('')||'<div class="empty">Ingen beskjeder akkurat nå.</div>')}
if(s.tab==='manage'){h=`<div class="row"><h2>Alle jobber</h2>${btn('+ Ny jobb','new','primary')}</div><p class="muted">Endre pris, ikon, hyppighet og status. Pausede oppgaver vises ikke for barna.</p>`+s.jobs.map(j=>jobCard(j,'manage')).join('');}
if(s.tab==='editor'){let j=s.jobs.find(x=>x.id===s.editId);h=`<h2>${j?'Rediger jobb':'Ny jobb'}</h2><form id="jobform" class="card"><label for="jn">Oppgave</label><input id="jn" required maxlength="80" value="${esc(j?.name||'')}"><label for="jp">Betaling i kr</label><input id="jp" type="number" min="1" max="10000" required value="${j?.price||25}"><label for="jf">Hyppighet</label><select id="jf">${['Daglig','Ukentlig','Ved behov'].map(f=>`<option ${j?.freq===f?'selected':''}>${f}</option>`).join('')}</select><label for="ji">Ikon</label><select id="ji">${['🗑️','🍽️','🧹','🧽','👕','🚗','🍳','🪴','🐈','🛏️','📦','⚡'].map(i=>`<option ${j?.icon===i?'selected':''}>${i}</option>`).join('')}</select><div class="actions"><button class="primary" type="submit">Lagre jobb</button>${btn('Avbryt','tab:manage')}</div></form>`}
if(s.tab==='money'){h='<h2>Lønn og utbetaling</h2><p class="muted">Opptjent regnes fra godkjenningsdatoen. Beløpene inkluderer både utbetalte og ubetalte jobber.</p>'+(par?['b1','b2']:[u]).map(w=>`<div class="card"><div class="row"><h3>${esc(s.names[w])}</h3><span class="pill ${due(w)?'warn':'ok'}">${due(w)?'Utestående':'Alt betalt'}</span></div><div class="grid" style="margin:15px 0"><div class="stat"><small>Denne uka</small><strong class="green">${money(weekEarned(w))}</strong></div><div class="stat"><small>Hittil i år</small><strong>${money(yearEarned(w))}</strong></div></div><hr><div class="row"><span>Til gode</span><strong class="price">${money(due(w))}</strong></div><div class="row" style="margin-top:10px"><small>Utbetalt totalt</small><b>${money(s.paid[w])}</b></div>${par&&due(w)?`<div class="actions">${btn('Registrer betaling','pay:'+w,'primary')}</div>`:''}<details style="margin-top:18px"><summary>Betalingshistorikk (${payLog(w).length})</summary>${payLog(w).map(p=>`<div class="row" style="padding:10px 0;border-bottom:1px solid #34445a"><small>${new Date(p.at).toLocaleDateString('no-NO')}</small><b>${money(p.amount)}</b></div>`).join('')||'<p class="muted">Ingen betalinger registrert.</p>'}</details></div>`).join('')}

if(s.tab==='history'){h='<h2>Aktivitetslogg</h2>'+s.records.slice().reverse().map(r=>`<div class="card"><div class="row"><b>${jobName(r)}</b><span>${r.pay} kr</span></div><p class="muted">${esc(s.names[r.who])} · ${({taken:'Reservert',pending:'Sendt til godkjenning',approved:'Godkjent',paid:'Utbetalt',rejected:'Avvist',released:'Frigitt',expired:'Utløpt'})[r.status]||r.status} · ${new Date(r.at).toLocaleDateString('no-NO')}</p></div>`).join('')}
if(s.tab==='profile'){h=`<h2>Min profil</h2><form id="nickform" class="card"><label for="nick">Nickname</label><input id="nick" maxlength="20" required value="${esc(s.names[u])}"><button class="primary" type="submit" style="margin-top:12px">Lagre nickname</button></form>`}
$('content').innerHTML=h;let nf=$('nickform');if(nf)nf.onsubmit=e=>{e.preventDefault();let n=$('nick').value.trim();if(n){s.names[u]=n;save();render()}};let jf=$('jobform');if(jf)jf.onsubmit=e=>{e.preventDefault();if(s.user!=='parent')return;let name=$('jn').value.trim(),price=Number($('jp').value);if(!name||!Number.isFinite(price)||price<1||price>10000)return;let data={name,price:Math.round(price),freq:$('jf').value,icon:$('ji').value};let j=s.jobs.find(x=>x.id===s.editId);if(j)Object.assign(j,data);else s.jobs.push({...data,id:time()+Math.random(),enabled:true});s.tab='manage';save();render()}}
function act(a){let k=a.indexOf(':'),op=k<0?a:a.slice(0,k),arg=k<0?'':a.slice(k+1);if(op==='user'){s.user=arg;s.tab=arg==='parent'?'board':'board'}else if(op==='tab')s.tab=arg;else if(op==='new'&&s.user==='parent'){s.editId=null;s.tab='editor'}else if(op==='edit'&&s.user==='parent'){s.editId=Number(arg);s.tab='editor'}else if(op==='toggle'&&s.user==='parent'){let j=s.jobs.find(j=>j.id===Number(arg));if(j)j.enabled=!j.enabled}else if(op==='take'&&s.user!=='parent'){let j=s.jobs.find(j=>j.id===Number(arg));if(j&&available(j))s.records.push({id:time()+Math.random(),job:j.id,name:j.name,who:s.user,pay:j.price,period:period(j.freq,time()),status:'taken',at:time()})}else if(['finish','release','approve','reject','resubmit'].includes(op)){let r=s.records.find(r=>r.id===Number(arg));if(r){if(op==='finish'&&r.who===s.user&&r.status==='taken')r.status='pending';if(op==='release'&&r.who===s.user&&['taken','rejected'].includes(r.status))r.status='released';if(op==='resubmit'&&r.who===s.user&&r.status==='rejected'){r.status='pending';r.reason=''}if(op==='approve'&&s.user==='parent'&&r.status==='pending'){r.status='approved';r.approvedAt=time()}if(op==='reject'&&s.user==='parent'&&r.status==='pending'){let reason=prompt('Hvorfor avvises jobben? Barnet får se begrunnelsen.');if(reason===null)return;r.reason=reason.trim()||'Jobben må gjøres bedre før godkjenning.';r.status='rejected'}}}else if(op==='pay'&&s.user==='parent'){let amount=due(arg);if(amount){let input=prompt(`Hvor mye er betalt til ${s.names[arg]}? (maks ${amount} kr)`,String(amount));if(input===null)return;let sum=Number(input.trim().replace(',','.'));if(!Number.isFinite(sum)||sum<=0||sum>amount||Math.round(sum*100)!==sum*100){alert('Oppgi et gyldig beløp (maks saldo).');return}let remaining=Math.round(sum*100);for(let r of s.records.filter(r=>r.who===arg&&r.status==='approved').sort((a,b)=>(a.approvedAt||a.at)-(b.approvedAt||b.at))){let outstanding=Math.round((r.pay-(r.partialPaid||0))*100),part=Math.min(remaining,outstanding);r.partialPaid=Math.round(((r.partialPaid||0)*100+part))/100;remaining-=part;if(Math.round(r.partialPaid*100)>=Math.round(r.pay*100)){r.status='paid';r.paidAt=time()}if(remaining<=0)break}s.paid[arg]=Math.round(((s.paid[arg]||0)+sum)*100)/100;s.payments.push({who:arg,amount:sum,at:time()})}}save();render()}
document.addEventListener('click',e=>{let b=e.target.closest('[data-act]');if(b)act(b.dataset.act)});save();render();
</script></body></html>
